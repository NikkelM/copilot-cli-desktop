name: Release
run-name: ${{ format('{0} {1}{2}', (inputs.is-dry-run && 'Dry-run') || 'Release', inputs.tag, (inputs.prerelease && ' beta') || '') }}

# Started by hand rather than by pushing a tag, so the tag is created only once everything
# has passed. A tag in this repository therefore always names something that built.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Base version (Major.Minor.Patch)"
        required: true
      prerelease:
        description: "Build a beta prerelease with an automatic build number"
        type: boolean
        default: false
      is-dry-run:
        description: "Dry-run (build and check only, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: desktop-release
  cancel-in-progress: false

env:
  RELEASE_BASE_VERSION: ${{ inputs.tag }}
  PRERELEASE: ${{ inputs.prerelease }}
  RELEASE_BRANCH: ${{ github.ref_name }}

jobs:
  # Fails before anything is built, so a malformed version number costs seconds rather than
  # the twenty minutes the rest of this takes.
  version:
    name: Check the version number
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check input tag format
        id: resolve
        run: |
          version="$(node scripts/release-version.mjs "$RELEASE_BASE_VERSION")"
          if [[ "$version" == *-* ]]; then
            echo "::error::Use a base Major.Minor.Patch version and the prerelease option."
            exit 1
          fi
          if [ "$PRERELEASE" = true ]; then
            tags="$RUNNER_TEMP/prerelease-tags.txt"
            git ls-remote --tags --refs origin "refs/tags/v$version-beta.*" > "$tags"
            version="$(node scripts/release-version.mjs "$version" --prerelease --tags-file "$tags")"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Refuse an existing release tag
        env:
          RELEASE_VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" != branch ]; then
            echo "::error::Run releases from a branch, not an existing tag."
            exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" > /dev/null; then
            echo "::error::The release tag already exists. Choose a new version."
            exit 1
          else
            status=$?
            if [ "$status" -ne 2 ]; then
              echo "::error::Could not check existing release tags."
              exit "$status"
            fi
          fi

  # The same two jobs CI runs, from the same file. A release passes exactly what a push
  # passes, and neither can drift from the other - with the tests run on Windows as well,
  # since that is what is being shipped and the extra minutes are noise beside the build.
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml
    with:
      windows: true

  release:
    name: ${{ format('{0} {1}', (inputs.is-dry-run && 'Dry-run') || 'Release', needs.version.outputs.version) }}
    needs: [checks, version]
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ needs.version.outputs.version }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Check updater signing credentials
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Configure TAURI_SIGNING_PRIVATE_KEY before building a release."
            exit 1
          fi
          probe="$RUNNER_TEMP/updater-signing-probe.txt"
          printf 'Updater signing configuration check\n' > "$probe"
          npm run tauri -- signer sign --app-version "$RELEASE_VERSION" "$probe"
          rm -f "$probe" "$probe.sig"

      # Stamp the npm, bundler and Cargo versions together before signing
      - name: Set the version
        shell: bash
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          node scripts/release-version.mjs "$RELEASE_VERSION" --set
          cargo update --package copilot-cli-desktop --manifest-path src-tauri/Cargo.toml

      # Builds the frontend, compiles the sidecar, assembles its dependency bundle and
      # packages the lot - tauri.conf.json's beforeBuildCommand does the first three.
      #
      # Detached updater signatures are separate from Windows code signing
      - name: Build installers and updater signatures
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri build

      - name: Prepare signed update artifacts and release notes
        shell: bash
        run: |
          node scripts/updater-manifest.mjs \
            --version "$RELEASE_VERSION" \
            --repository "$GITHUB_REPOSITORY" \
            --bundle src-tauri/target/release/bundle \
            --output release-artifacts \
            --changelog CHANGELOG.md
          cat release-artifacts/RELEASE_NOTES.md

      - name: Verify updater signatures and signed versions
        env:
          UPDATER_ARTIFACTS_DIR: ${{ github.workspace }}/release-artifacts
        run: cargo test --manifest-path src-tauri/Cargo.toml app_updates::tests::release_artifacts_match_the_configured_public_key_and_version -- --ignored --exact

      # Kept even on a dry run, which is most of the point of one: the installer can be
      # downloaded and tried before anything is published.
      - name: Upload installers to the workflow
        uses: actions/upload-artifact@v7
        with:
          name: installers-${{ env.RELEASE_VERSION }}
          path: release-artifacts
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Tag and push
        if: ${{ !inputs.is-dry-run }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit --message "Release $RELEASE_VERSION"
          fi
          git tag "v$RELEASE_VERSION" --annotate --message "Release $RELEASE_VERSION"
          git push origin "HEAD:$RELEASE_BRANCH" --tags

      - name: Create the release
        if: ${{ !inputs.is-dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          shopt -s nullglob
          assets=(release-artifacts/*.exe release-artifacts/*.msi release-artifacts/*.sig release-artifacts/latest.json)
          options=()
          if [ "$PRERELEASE" = true ]; then
            options+=(--prerelease --latest=false)
          fi
          gh release create "v$RELEASE_VERSION" \
            --title "v$RELEASE_VERSION" \
            --notes-file release-artifacts/RELEASE_NOTES.md \
            "${options[@]}" \
            "${assets[@]}"
