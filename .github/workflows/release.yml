name: Release

# Tags only. A release is a deliberate act, and building one takes twelve minutes of
# compilation that no ordinary push should pay for.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to build, for a release that needs rebuilding
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not throw away another that took twelve minutes.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Windows
            args: ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The same checks CI runs. A tag skips nothing: a release built from code that does
      # not typecheck is worse than no release.
      - run: npm run typecheck
      - run: npm test

      # Builds the frontend, compiles the sidecar, assembles its bundle and packages the
      # lot - tauri.conf.json's beforeBuildCommand does the first three.
      - uses: tauri-apps/tauri-action@action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: ${{ inputs.tag || github.ref_name }}
          releaseBody: |
            Requires [Node.js](https://nodejs.org) 24+ and the
            [GitHub Copilot CLI](https://docs.github.com/copilot/how-tos/copilot-cli),
            logged in. Both are checked on first run.

            The installer is unsigned, so Windows SmartScreen will warn on first launch.
          # Left as a draft on purpose. The notes are worth reading before anyone is told
          # there is something to download.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
