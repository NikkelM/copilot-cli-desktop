name: Release
run-name: ${{ format('{0} {1}', (inputs.is-dry-run && 'Dry-run') || 'Release', inputs.tag) }}

# Started by hand rather than by pushing a tag, so the tag is created only once everything
# has passed. A tag in this repository therefore always names something that built.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / Version number"
        required: true
      is-dry-run:
        description: "Dry-run (build and check only, publish nothing)"
        type: boolean
        default: true

permissions:
  contents: write # required for pushing the release commit and tag, and creating the release

jobs:
  # Fails before anything is built, so a malformed version number costs seconds rather than
  # the twenty minutes the rest of this takes.
  version:
    name: Check the version number
    runs-on: ubuntu-latest
    steps:
      - name: Check input tag format
        run: |
          if ! echo "${{ inputs.tag }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error title=Invalid version number::Version numbers must follow the Major.Minor.Patch format (e.g. 0.2.0), without a leading v."
            exit 1
          fi

  # The same two jobs CI runs, from the same file. A release passes exactly what a push
  # passes, and neither can drift from the other.
  checks:
    needs: version
    uses: ./.github/workflows/checks.yml

  release:
    name: ${{ format('{0} {1}', (inputs.is-dry-run && 'Dry-run') || 'Release', inputs.tag) }}
    needs: checks
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Three files carry the version and all three are read by something: npm, the bundler,
      # and cargo. Setting them here means a release never depends on remembering to.
      - name: Set the version
        shell: bash
        run: |
          node -e "
            const fs = require('node:fs');
            for (const f of ['package.json', 'src-tauri/tauri.conf.json']) {
              const j = JSON.parse(fs.readFileSync(f, 'utf8'));
              j.version = '${{ inputs.tag }}';
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + '\n');
            }
          "
          sed -i 's/^version = ".*"/version = "${{ inputs.tag }}"/' src-tauri/Cargo.toml
          cargo update --package copilot-cli-desktop --manifest-path src-tauri/Cargo.toml

      # Builds the frontend, compiles the sidecar, assembles its dependency bundle and
      # packages the lot - tauri.conf.json's beforeBuildCommand does the first three.
      #
      # Unsigned. SignTool is not what is missing - Tauri already calls it, through
      # bundle.windows.certificateThumbprint or signCommand. A certificate CI can reach is,
      # and since 2023 a bought one lives on hardware. The README explains the options.
      - name: Build the installers
        run: npm run tauri build

      - name: Collect what was built
        id: artifacts
        shell: bash
        run: |
          {
            echo 'paths<<EOF'
            find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*-setup.exe' \)
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Kept even on a dry run, which is most of the point of one: the installer can be
      # downloaded and tried before anything is published.
      - name: Upload installers to the workflow
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ inputs.tag }}
          path: ${{ steps.artifacts.outputs.paths }}
          retention-days: 7

      - name: Tag and push
        if: ${{ !inputs.is-dry-run }}
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit --message "Release ${{ inputs.tag }}"
          git tag "v${{ inputs.tag }}" --annotate --message "Release ${{ inputs.tag }}"
          git push origin HEAD:${{ github.ref_name }} --tags

      # Taken from CHANGELOG.md between the markers, so the notes are written and reviewed in
      # the repository rather than typed into a release form once and never seen again.
      - name: Create release notes
        if: ${{ !inputs.is-dry-run }}
        shell: bash
        run: |
          sed -n '/<!--Releasenotes start-->/,/<!--Releasenotes end-->/p' CHANGELOG.md \
            | sed '/<!--Releasenotes/d' > RELEASE_NOTES.md
          printf '\n**[Full changelog](CHANGELOG.md)**\n' >> RELEASE_NOTES.md
          cat RELEASE_NOTES.md

      # A draft, so the notes can be read before anyone is told there is something to download.
      - name: Create the release
        if: ${{ !inputs.is-dry-run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release create "v${{ inputs.tag }}" \
            --title "v${{ inputs.tag }}" \
            --notes-file RELEASE_NOTES.md \
            --draft \
            $(find src-tauri/target/release/bundle -type f \( -name '*.msi' -o -name '*-setup.exe' \))
