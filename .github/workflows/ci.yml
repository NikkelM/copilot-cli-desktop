name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same branch makes the first one's answer irrelevant, and the Rust job
# is slow enough that leaving it running would queue work behind a result nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The sidecar reads the CLI's history with node:sqlite, which arrived in Node 22.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Both projects: the root config covers the frontend, the workspace covers its own.
      - run: npm run typecheck

      - run: npm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # What Tauri links against. The app is built for Windows, but nothing in this crate is
      # platform-specific, so checking it here costs a fraction of what a Windows runner does.
      - name: Install Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tauri-build reads tauri.conf.json and expects frontendDist to exist, so the crate
      # cannot be checked at all without the frontend having been built first.
      - run: npm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
