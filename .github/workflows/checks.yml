name: Checks

# Called rather than triggered. Both CI and Release run exactly these, so the checks a
# release passes cannot drift from the ones a push passes - which is the whole reason they
# live in one file instead of being copied into two.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  types-and-tests:
    name: Types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The sidecar reads the CLI's history with node:sqlite, which arrived in Node 22.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Both projects: the root config covers the frontend, the workspace covers its own.
      - run: npm run typecheck

      - run: npm test

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # What Tauri links against. The app is built for Windows, but nothing in this crate is
      # platform-specific, so checking it here costs a fraction of what a Windows runner does.
      - name: Install Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # tauri-build reads tauri.conf.json and refuses to proceed when a declared resource is
      # missing, so the sidecar bundle has to be assembled before the crate can be checked at
      # all - and npm run build produces the frontendDist it also expects.
      - run: npm run build
      - run: npm run build:sidecar
      - run: npm run bundle:sidecar

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml
